name: Conference Organizer - Build

# This file must live at the repo ROOT (.github/workflows/), even though
# the application code lives in the "Conference Organizer/" subfolder —
# GitHub Actions only runs workflows placed at the repository root. All
# commands below run inside that subfolder thanks to
# `defaults.run.working-directory`.

on:
  push:
    tags:
      - "conference-organizer-v*"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: "Conference Organizer"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build (macOS)
        if: matrix.platform == 'macos'
        run: |
          chmod +x scripts/build_mac.sh
          ./scripts/build_mac.sh
          cd dist && zip -r "ConferenceOrganizer-macOS.zip" "Conference Organizer.app"

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: |
          chmod +x scripts/build_linux.sh
          ./scripts/build_linux.sh
          cd dist && zip -j "ConferenceOrganizer-Linux.zip" "Conference Organizer"

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          call scripts\build_windows.bat
          powershell -Command "Compress-Archive -Path 'dist\Conference Organizer.exe' -DestinationPath 'dist\ConferenceOrganizer-Windows.zip'"

      - uses: actions/upload-artifact@v4
        with:
          name: conference-organizer-${{ matrix.platform }}
          path: "Conference Organizer/dist/ConferenceOrganizer-${{ matrix.platform == 'macos' && 'macOS' || matrix.platform == 'linux' && 'Linux' || 'Windows' }}.zip"
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*.zip
          generate_release_notes: true
